name: Refresh bundled data

# Re-runs the scrapers on the first Monday of each month (and on demand) and opens a PR
# with any changed files under public/data/. Overpass-heavy scrapers are allowed to fail
# individually so one flaky mirror does not block the crime/IMD/etc refresh.
on:
  schedule:
    - cron: "17 3 1-7 * 1"
  workflow_dispatch:
    inputs:
      heavy:
        description: "Also run Overpass-heavy scrapers (restaurants, bike parking, green space)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Area layers (official statistics)
        run: |
          for s in imd rent population-density ptal air-quality noise house-prices broadband flood-risk; do
            [ -f "scrapers/$s.js" ] || continue
            echo "::group::$s"; node "scrapers/$s.js" || echo "::warning::$s failed"; echo "::endgroup::"
          done

      - name: Crime (data.police.uk, slow)
        run: node scrapers/crime.js || echo "::warning::crime failed"

      - name: Point layers (OpenStreetMap / GIAS)
        run: |
          for s in tube-rail waitrose supermarkets coffee libraries pubs parks yoga gyms cinemas betting gp-surgeries dentists coworking schools; do
            [ -f "scrapers/$s.js" ] || continue
            echo "::group::$s"; node "scrapers/$s.js" || echo "::warning::$s failed"; echo "::endgroup::"
          done

      - name: Overpass-heavy layers
        if: ${{ github.event_name == 'schedule' || inputs.heavy }}
        run: |
          for s in restaurants bike-parking green-space; do
            echo "::group::$s"; node "scrapers/$s.js" || echo "::warning::$s failed"; echo "::endgroup::"
          done

      - name: Rebuild manifest and check the site still builds
        run: |
          node scripts/build-manifest.js
          npm run build
          npm test

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/monthly-refresh
          delete-branch: true
          add-paths: public/data/**
          commit-message: "data: monthly refresh of bundled layers"
          title: "Monthly data refresh"
          body: |
            Automated run of the scrapers in `scrapers/`. Review the diff summary in
            `public/data/manifest.json` (generated dates and counts), spot-check a few
            layers in a preview deploy, then merge.
