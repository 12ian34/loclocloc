[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints everything under /assets, so those files can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bundled data files are unhashed and change on data refreshes (roughly monthly).
# Cache for a day at the edge/browser but allow a stale copy while revalidating.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
